name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Build do zip e anexo ao release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar versão do manifest com a tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'EOF'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest = Path("custom_components/inmet_alertas/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"manifest.json -> version {version}")
          EOF

      - name: Empacotar a integração (zip flat, sem caches)
        shell: bash
        run: |
          cd custom_components/inmet_alertas
          find . -name "__pycache__" -type d -exec rm -rf {} +
          zip inmet_alertas.zip -r ./ -x "*.pyc" "*/__pycache__/*"

      - name: Anexar o zip ao release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/inmet_alertas/inmet_alertas.zip
