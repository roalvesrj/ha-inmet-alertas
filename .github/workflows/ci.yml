name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Testes (suíte completa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Suíte completa + gate de cobertura do config flow (Bronze)
        run: >
          python -m pytest tests -q
          --cov=custom_components.inmet_alertas.config_flow
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Cobertura geral do pacote (rumo ao Silver, meta 95%)
        run: >
          python -m pytest tests -q
          --cov=custom_components.inmet_alertas
          --cov-report=term-missing

  frontend:
    name: Testes JS (plugin do mapa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Plugin INMET (node --test)
        run: node --test "tests/js/*.test.mjs"

  validate:
    name: Hassfest + HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
