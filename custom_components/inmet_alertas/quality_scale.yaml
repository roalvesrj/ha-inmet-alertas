# Status do Integration Quality Scale — tier Bronze.
# Referência: SPEC.md (seção 3) e docs oficiais:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  action_setup: done
  appropriate_polling: done
  brands: done
  common_modules: done
  config_flow: done
  config_flow_test_coverage: done
  dependency_transparency: done
  docs_actions: done
  docs_conditions:
    status: exempt
    comment: A integração não expõe conditions.
  docs_high_level_description: done
  docs_installation_instructions: done
  docs_removal_instructions: done
  docs_triggers:
    status: exempt
    comment: A integração não expõe triggers (comunica via eventos do bus).
  entity_event_setup:
    status: exempt
    comment: As entidades não assinam eventos; os dados vêm do DataUpdateCoordinator.
  entity_unique_id: done
  has_entity_name: done
  runtime_data: done
  test_before_configure: done
  test_before_setup: done
  unique_config_entry: done

  # Silver (em andamento — v1.16.0)
  action_exceptions: done
  config_entry_unloading: done
  docs_configuration_parameters: done
  docs_installation_parameters: done
  entity_unavailable: done
  integration_owner: done
  log_when_unavailable: done
  parallel_updates: done
  reauthentication_flow:
    status: exempt
    comment: Integração não usa autenticação (feed público do INMET).
  test_coverage:
    status: todo
    comment: >-
      Foco atual (Silver): exige >95% em todos os módulos, sem exceções.
      Baseline em 2026-10-09: ~60% (suíte combinada). Não bloqueante na 1.16.0
      (Bronze mantido); sprint dedicada de cobertura planejada
      (coordinator/entidades/__init__).
